<style>
:root{

*{box-sizing:border-box}

html{background:var(--bg)}

body{
  margin:0;
  background:var(--bg);

}

main{

}

h1{

}

.intro{

}

.hero,
.card{

.hero{

}

.hero h2{

}

#app{margin-top:16px}

}

.progress-row{

}

.bar-track{

  background:var(--bar-bg);
}

.bar{
  height:100%;

  background:var(--green);

}

.card{background:var(--card)}
.question-card{background:var(--content)}

.question-meta{

.card h2{

  padding:16px 17px;

  line-height:1.55;
  cursor:pointer;
  transition:.18s ease;
}

.option:hover{
  background:rgba(255,253,249,.86);
  transform:translateY(-1px);
}

.option.selected{
  background:var(--content-hover);
  border-color:rgba(79,75,69,.25);
}

.option-label{
  display:inline-flex;
  width:28px;
  height:28px;
  align-items:center;
  justify-content:center;
  margin-right:9px;
  border-radius:50%;
  background:rgba(79,75,69,.09);
  color:var(--green);
  font-weight:700;
}

button{
  width:100%;
  margin-top:18px;
  padding:15px 18px;
  border-radius:22px;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
  transition:.18s ease;
}

.nav-buttons button:not(.secondary-btn){
  background:#C5D8C0;
  color:#FFFDF9;
  border:1px solid #C5D8C0;
}

.secondary-btn{
  background:rgba(255,253,249,.75);
  border:2px solid #B9D98E;
  color:#60735A;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

button:active{transform:scale(.99)}

.nav-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;

.nav-buttons button{margin-top:18px}

.dim-list{margin:16px 0 8px}

.dim-row{

  gap:12px;
  margin:10px 0;

.dim-name{color:var(--muted)}
.dim-value{text-align:right;color:var(--green);font-weight:600}

.dim-desc{
  grid-column:1 / -1;

  font-size:11px;
  line-height:1.6;

.result-summary{

.result-summary p{margin:0!important;font-weight:600}

.result-disclaimer{

.result-actions{

  gap:12px;

.copy-btn{
  background:#7BB8E8;

  border:1px solid #7BB8E8;
  margin-top:28px;

@media(max-width:560px){

.dim-bar-track{

.dim-bar{

.footer{

      {t: "有能力者当守护弱者与秩序", s: [0,0,0,2]}
    ]
  },
  {
    q: "完成所有题目后，你的OC最想被记住的是：",
    opts: [
      {t: "一个让人感到被理解与被爱的存在", s: [2,0,0,0]},
      {t: "一个永远在发现新可能的存在", s: [0,2,0,0]},
      {t: "一个真实而独立的存在", s: [0,0,2,0]},
      {t: "一个值得托付与依靠的守护者", s: [0,0,0,2]}
    ]
  }
];

/* ========== 状态 ========== */
let index = 0;
let answers = [];
let scores = [0, 0, 0, 0]; // 关系 / 探索 / 独立 / 守护

function render() {
  if (index >= 60) {
    return showResult();
  }

  const item = questions[index];
  const percent = Math.round((index / 60) * 100);

  document.getElementById('app').innerHTML = `
    <div class="progress">
      <div class="progress-row">
        <span>第 ${index + 1} / 60 题</span>
        <span>${percent}%</span>
      </div>
      <div class="bar-track">
        <div class="bar" style="width:${percent}%"></div>
      </div>
    </div>

    <section class="card question-card">
      <p class="question-meta">QUESTION ${String(index + 1).padStart(2, '0')}</p>
      <h2>${item.q}</h2>
      ${item.opts.map((o, i) => `
        <div class="option ${answers[index] === i ? 'selected' : ''}" onclick="choose(${i}, this)">
          <span class="option-label">${String.fromCharCode(65 + i)}</span>${o.t}
        </div>
      `).join('')}
      <div class="nav-buttons">
        <button class="secondary-btn" onclick="prev()" ${index === 0 ? 'disabled' : ''}>上一题</button>
        <button onclick="next()">下一题</button>
      </div>
    </section>
  `;
}

function choose(i, el) {
  answers[index] = i;
  document.querySelectorAll('.option').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
}

function recompute() {
  scores = [0, 0, 0, 0];
  answers.forEach((a, qi) => {
    if (a === undefined) return;
    const s = questions[qi].opts[a].s;
    scores[0] += s[0];
    scores[1] += s[1];
    scores[2] += s[2];
    scores[3] += s[3];
  });
}

function next() {
  if (answers[index] === undefined) return;
  recompute();
  index++;
  render();
}

function prev() {
  if (index > 0) {
    recompute();
    index--;
    render();
  }
}

function normalize(arr) {
  const max = Math.max(...arr, 1);
  return arr.map(v => Math.round((v / max) * 100));
}

function pickAnimal() {
  // 用四维分数生成稳定索引
  const total = scores.reduce((a, b) => a + b, 0) || 1;
  const weights = scores.map(s => s / total);
  // 组合出 0-31 的索引
  let id = 0;
  id += Math.floor(weights[0] * 8) % 8;
  id += Math.floor(weights[1] * 8) % 8 * 2;
  id += Math.floor(weights[2] * 4) % 4 * 4;
  id += Math.floor(weights[3] * 4) % 4 * 8;
  id = id % 32;
  // 再根据最高维微调，增加区分度
  const maxDim = scores.indexOf(Math.max(...scores));
  id = (id + maxDim * 7 + scores[maxDim]) % 32;
  return id;
}

function buildSummary(a, dims) {
  const dimNames = ['关系倾向', '探索欲', '独立性', '守护性'];
  const ranked = dims.map((v, i) => ({v, i})).sort((x, y) => y.v - x.v);
  const first = dimNames[ranked[0].i];
  const second = dimNames[ranked[1].i];
  return `你的OC更接近「${a.name}」：以${first}为核心、以${second}为辅助，在${a.tagline.replace(/。$/, '')}的气质下，形成了独属于TA的生存方式与关系模式。`;
}

async function copyResult() {
  const card = document.querySelector('.result-card');
  const details = Array.from(card.querySelectorAll('.result-section p'))
    .map(p => p.textContent.trim())
    .filter(Boolean)
    .join('\n');
  const text = `《OC动物塑测试60问》结果\n${card.querySelector('.result-animal').textContent}｜${card.querySelector('.result-tagline').textContent}\n\n一句话总结：${card.querySelector('.result-summary p').textContent}\n\n${details}`;
  const btn = document.getElementById('copyResult');
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = '复制结果', 1500);
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    btn.textContent = '已复制 ✓';
    setTimeout(() => btn.textContent = '复制结果', 1500);
  }
}

function showResult() {
  recompute();
  const id = pickAnimal();
  const a = animals[id];
  const dims = normalize(scores);
  const dimNames = ['关系倾向', '探索欲', '独立性', '守护性'];
  const dimDescs = ['重视陪伴、信任与情感连接', '关注未知、变化与新的可能性', '重视自我判断、空间与行动自主', '重视责任、承诺与保护意识'];

  document.getElementById('app').innerHTML = `
    <section class="card result-card">
      <div class="result-header">
        <div class="result-label">YOUR OC ANIMAL TYPE</div>
        <h2 class="result-animal">${a.name}</h2>
        <p class="result-tagline">${a.tagline}</p>
      </div>

      <div class="result-section">
        <h3>动物习性解析</h3>
        <p>${a.habit}</p>
        <p>${a.why}</p>
      </div>

      <div class="result-section">
        <h3>人格维度</h3>
        <div class="dim-list">
          ${dimNames.map((name, i) => `
            <div class="dim-row">
              <span class="dim-name">${name}</span>
              <div class="dim-bar-track">
                <div class="dim-bar" style="width:${dims[i]}%"></div>
              </div>
              <span class="dim-value">${dims[i]}%</span>
              <div class="dim-desc">${dimDescs[i]}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="result-section">
        <h3>角色优势</h3>
        <p>${a.advantage}</p>
      </div>

      <div class="result-section">
        <h3>隐藏弱点与成长方向</h3>
        <p>${a.weakness}</p>
      </div>

      <div class="result-section">
        <h3>适合OC定位</h3>
        <div class="tags-row">
          ${a.roles.map(r => `<span class="role-tag">${r}</span>`).join('')}
        </div>
      </div>

      <div class="result-section">
        <h3>一句话总结</h3>
        <div class="result-summary">
          <p>${buildSummary(a, dims)}</p>
          <div class="result-disclaimer">免责声明：本测试仅用于OC角色塑造、设定整理与创作灵感参考，不代表对真实人格、心理状态或现实行为的专业判断，也不构成任何心理诊断。</div>
        </div>
      </div>

      <div class="result-actions">
        <button class="restart-btn" onclick="restart()">重新测试</button>
        <button class="copy-btn" id="copyResult" onclick="copyResult()">复制结果</button>
      </div>
    </section>
  `;
}

function restart() {
  index = 0;
  answers = [];
  scores = [0, 0, 0, 0];
  render();
}

render();
</script>
</body>
</html>
